<figure class="concept" id="pvs-explorer" aria-labelledby="pvs-explorer-title">
  <h3 id="pvs-explorer-title">What one leaf of e1m1 can actually see</h3>
  <style>
    #pvs-explorer .pvs-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 14px; }
    #pvs-explorer .pvs-controls label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    #pvs-explorer .pvs-controls input, #pvs-explorer .pvs-controls select {
      font: inherit; font-size: 13px; color: var(--ink); background: var(--surface);
      border: 1px solid var(--rule); border-radius: 2px; padding: 3px 6px;
    }
    #pvs-explorer .pvs-controls input { width: 6em; }
    #pvs-explorer .pvs-map-wrap { overflow-x: auto; border: 1px solid var(--rule); background: var(--surface); }

    #pvs-explorer rect { fill: var(--surface-2); stroke: var(--rule); stroke-width: 0.5; cursor: pointer; }
    #pvs-explorer rect.seen { fill: var(--cl-bg); stroke: var(--cl); }
    #pvs-explorer rect.sel { fill: var(--sim); fill-opacity: 0.55; stroke: var(--sim); stroke-width: 1.6; pointer-events: none; }
    #pvs-explorer rect.dim { opacity: 0.16; }
    #pvs-explorer .pvs-status { font-size: 15px; margin: 12px 0 4px; }
    #pvs-explorer .pvs-status b { color: var(--sim); }
    #pvs-explorer .pvs-help { font-size: 13px; color: var(--muted); margin: 0; }
    #pvs-explorer .pvs-key { display: inline-block; margin-right: 14px; }
    #pvs-explorer .pvs-key i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border: 1px solid var(--rule); vertical-align: baseline; }
    #pvs-explorer .pvs-key.k-sel i { background: var(--sim); border-color: var(--sim); }
    #pvs-explorer .pvs-key.k-seen i { background: var(--cl-bg); border-color: var(--cl); }
    #pvs-explorer .pvs-key.k-off i { background: var(--surface-2); }
  </style>

        <option value="0">Lower third</option>
        <option value="1">Middle third</option>
        <option value="2">Upper third</option>

  <script>
  (function () {
    var fig = document.getElementById('pvs-explorer');
    var live = fig.querySelector('.pvs-live');
    var data = null;
    try { data = JSON.parse(document.getElementById('pvs-data').textContent); } catch (e) { data = null; }
    if (!data || !data.leaves) {
      live.hidden = true;
      fig.querySelector('.pvs-missing').hidden = false;
      return;
    }

    // Base-64 varint: 5 payload bits per character, bit 5 continues the number.
    var ALPHA = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_';
    var IDX = {};
    for (var a = 0; a < ALPHA.length; a++) IDX[ALPHA.charCodeAt(a)] = a;

    function reader(s) {
      var r = { i: 0, end: s.length };
      r.next = function () {
        var n = 0, sh = 0, c;
        do { c = IDX[s.charCodeAt(r.i++)]; n |= (c & 31) << sh; sh += 5; } while (c & 32);
        return n;
      };
      return r;
    }

    var N = data.leaves;
    var BOX_FIELDS = 6;
    var box = new Int16Array(N * BOX_FIELDS);
    var rd = reader(data.box);
    for (var b = 0; b < box.length; b++) box[b] = rd.next();

    // One row per leaf, as (gap, run-length) pairs over leaf indices.
    var rows = data.pvs.split('.');
    function pvsOf(i) {
      var r = reader(rows[i]), out = [], prev = -1;
      while (r.i < r.end) {
        var start = prev + r.next(), run = r.next();
        for (var k = 0; k < run; k++) out.push(start + k);
        prev = start + run - 1;
      }
      return out;
    }

    var svg = document.getElementById('pvs-map');
    var status = document.getElementById('pvs-status');
    var num = document.getElementById('pvs-leaf');
    var band = document.getElementById('pvs-band');
    var SVG_NS = 'http://www.w3.org/2000/svg';

    svg.setAttribute('viewBox', '0 0 ' + data.w + ' ' + data.h);
    num.max = N;

    // Paint biggest first: a few leaves span most of the map, and small ones
    // must end up on top to stay both visible and clickable.
    var order = [];
    for (var o = 0; o < N; o++) order.push(o);
    order.sort(function (p, q) {
      var ap = box[p * BOX_FIELDS + 2] * box[p * BOX_FIELDS + 3];
      var aq = box[q * BOX_FIELDS + 2] * box[q * BOX_FIELDS + 3];
      return aq - ap || p - q;
    });

    var rects = new Array(N);
    var frag = document.createDocumentFragment();
    for (var n = 0; n < N; n++) {
      var i = order[n];
      var r = document.createElementNS(SVG_NS, 'rect');
      r.setAttribute('x', box[i * BOX_FIELDS]);
      r.setAttribute('y', box[i * BOX_FIELDS + 1]);
      r.setAttribute('width', box[i * BOX_FIELDS + 2]);
      r.setAttribute('height', box[i * BOX_FIELDS + 3]);
      r.leafIndex = i;
      rects[i] = r;
      frag.appendChild(r);
    }
    svg.appendChild(frag);

    // The selected leaf gets its own marker on top, so picking a large leaf
    // does not bury it under the small ones drawn over it.
    var marker = document.createElementNS(SVG_NS, 'rect');
    marker.setAttribute('class', 'sel');
    marker.setAttribute('width', 0);
    marker.setAttribute('height', 0);
    svg.appendChild(marker);

    var seen = new Uint8Array(N);   // 1 = in the selected leaf's PVS
    var dim = new Uint8Array(N);    // 1 = outside the chosen height band
    var lit = [];
    var sel = -1;

    function paint(i) {
      var c = seen[i] ? 'seen' : '';
      if (dim[i]) c += c ? ' dim' : 'dim';
      if (c) rects[i].setAttribute('class', c);
      else rects[i].removeAttribute('class');
    }

    function select(i) {
      if (i < 0 || i >= N || i === sel) return;
      var stale = lit;
      for (var k = 0; k < stale.length; k++) seen[stale[k]] = 0;
      lit = pvsOf(i);
      for (var j = 0; j < lit.length; j++) seen[lit[j]] = 1;
      sel = i;
      for (var s = 0; s < stale.length; s++) paint(stale[s]);
      for (var t = 0; t < lit.length; t++) paint(lit[t]);
      marker.setAttribute('x', box[i * BOX_FIELDS]);
      marker.setAttribute('y', box[i * BOX_FIELDS + 1]);
      marker.setAttribute('width', box[i * BOX_FIELDS + 2]);
      marker.setAttribute('height', box[i * BOX_FIELDS + 3]);
      if (num.value !== String(i + 1)) num.value = i + 1;
      status.innerHTML = 'Leaf <b>' + (i + 1) + '</b> sees <b>' + lit.length +
        '</b> of ' + N + ' leaves — ' + (100 * lit.length / N).toFixed(1) +
        '% of the map. The other ' + (N - lit.length) + ' are never touched by the render walk from here.';
    }

    // Height bands split the map's vertical extent in three, so vertically
    // stacked leaves that overlap in plan view can be told apart.
    function applyBand() {
      var b = parseInt(band.value, 10);
      var lo = b < 0 ? -1 : Math.round(b * data.zmax / 3);
      var hi = b < 0 ? data.zmax + 1 : Math.round((b + 1) * data.zmax / 3);
      for (var i = 0; i < N; i++) {
        var z = box[i * BOX_FIELDS + 4], dz = box[i * BOX_FIELDS + 5];
        dim[i] = (b < 0 || (z < hi && z + dz > lo)) ? 0 : 1;
        paint(i);
      }
    }

    svg.addEventListener('click', function (e) {
      if (e.target.leafIndex !== undefined) select(e.target.leafIndex);
    });
    num.addEventListener('input', function () {
      var v = parseInt(num.value, 10);
      if (v >= 1 && v <= N) select(v - 1);
    });
    band.addEventListener('change', applyBand);

    select(data.start);
  })();
  </script>

  <figcaption>Every one of e1m1's <b>1148 world leaves</b>, drawn as one rectangle each, in plan view rotated so the map's long axis runs left to right. Selecting a leaf lights up its potentially visible set — on average <b>117 leaves, about 10%</b> of the map; the sparsest row sees 1 leaf, the widest 303. That sparsity is what makes the run-length encoding pay: e1m1's whole vis lump is 40,843 bytes, against 165,312 for the same bit matrix stored flat. <b>This is a projection, not a plane section.</b> PVS is fully three-dimensional; leaves stacked vertically — a corridor over a room — land on top of each other here, which is why the height band control exists. Leaf numbering matches the engine's array, where PVS bit <i>i</i> means leaf <i>i</i>+1 and leaf 0 is the shared solid leaf with no vis row. Simplification: bounding boxes only (a leaf is a convex cell, not a box), coordinates quantised to a 4-unit grid and rounded outward. No leaf is omitted. Derived at build time from <code>maps/e1m1.bsp</code> in <code>id1/pak0.pak</code>; geometry and visibility relationships only, no map data is redistributed. Source: WinQuake/bspfile.h:213-225, WinQuake/model.c:115-160, WinQuake/r_main.c:491-519.</figcaption>
