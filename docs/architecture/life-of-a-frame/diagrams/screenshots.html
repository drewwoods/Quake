<div class="capture-set" data-renderer="software"><p class="capture-renderer-label">Software renderer</p>

<div class="capture-after"><p>r_drawentities 0</p><img loading="lazy" width="640" height="480" src="shots/software/no-entities.png" alt="r_drawentities 0. The enemy, pickup and weapon disappear. The bars also disappear: moving brush models are entities. The static BSP world and particles remain."></div>

<figure class="capture-pair" id="capture-software-speeds"><h4>Renderer counters in the console notification area</h4><div class="capture-images">
<div class="capture-before"><p>r_speeds 0</p><img loading="lazy" width="640" height="480" src="shots/software/normal.png" alt="r_speeds 0. The top-left console notifications show render time in milliseconds, faceclip, polygon count, drawn polygon count, and surface count (c_surf)."></div>

<div class="capture-set" data-renderer="gl"><p class="capture-renderer-label">GL renderer</p>
<figure class="capture-pair" id="capture-gl-visibility"><h4>Visibility: more submitted geometry need not change the view</h4><div class="capture-images">
<div class="capture-before"><p>r_novis 0</p><img loading="lazy" width="640" height="480" src="shots/normal.png" alt="r_novis 0. PVS rejection is disabled. Walls still occlude geometry through depth testing, so a similar image does not imply equal rendering work."></div>
<div class="capture-after"><p>r_novis 1</p><img loading="lazy" width="640" height="480" src="shots/no-vis.png" alt="r_novis 1. PVS rejection is disabled. Walls still occlude geometry through depth testing, so a similar image does not imply equal rendering work."></div>
</div><div class="capture-control" hidden><label for="capture-gl-visibility-slider">Reveal changed image (r_novis 0 → r_novis 1)</label> <input id="capture-gl-visibility-slider" type="range" min="0" max="100" value="50" step="1" aria-describedby="capture-gl-visibility-description"> <output for="capture-gl-visibility-slider">50%</output></div><figcaption id="capture-gl-visibility-description">PVS rejection is disabled. Walls still occlude geometry through depth testing, so a similar image does not imply equal rendering work.</figcaption></figure>

<figure class="capture-pair" id="capture-gl-lightmaps"><h4>The lightmap pass</h4><div class="capture-images">
<div class="capture-before"><p>r_lightmap 0</p><img loading="lazy" width="640" height="480" src="shots/normal.png" alt="r_lightmap 0. The multipass path draws its lightmap texture without the usual blend. This diagnostic is not a final illumination-only render; entities keep their textures. Both captures use -nomtex and gl_texsort 1."></div>

<div class="capture-set" data-renderer="compare"><p class="capture-renderer-label">Compare renderer</p>
<figure class="capture-pair" id="capture-compare-renderers"><h4>Renderer: GLQuake (OpenGL) vs Software Quake</h4><div class="capture-images">
<div class="capture-before"><p>Software</p><img loading="lazy" width="640" height="480" src="shots/software/normal.png" alt="Software. The exact same camera viewpoint rendered by Software Quake and GLQuake. Software Quake uses the 8-bit paletted software pipeline with surface caching and span rasterization; GLQuake uses hardware rasterization with bilinear filtering and multipass dynamic lightmaps."></div>
<div class="capture-after"><p>GL</p><img loading="lazy" width="640" height="480" src="shots/normal.png" alt="GL. The exact same camera viewpoint rendered by Software Quake and GLQuake. Software Quake uses the 8-bit paletted software pipeline with surface caching and span rasterization; GLQuake uses hardware rasterization with bilinear filtering and multipass dynamic lightmaps."></div>
</div><div class="capture-control" hidden><label for="capture-compare-renderers-slider">Reveal changed image (Software → GL)</label> <input id="capture-compare-renderers-slider" type="range" min="0" max="100" value="50" step="1" aria-describedby="capture-compare-renderers-description"> <output for="capture-compare-renderers-slider">50%</output></div><figcaption id="capture-compare-renderers-description">The exact same camera viewpoint rendered by Software Quake and GLQuake. Software Quake uses the 8-bit paletted software pipeline with surface caching and span rasterization; GLQuake uses hardware rasterization with bilinear filtering and multipass dynamic lightmaps.</figcaption></figure>
<figure class="capture-pair" id="capture-compare-fullbright"><h4>Fullbright texels: e1m1 corridor lamps</h4><div class="capture-images">
<div class="capture-before"><p>Software</p><img loading="lazy" width="640" height="480" src="shots/software/fullbright.png" alt="Software. Every light level of the colormap maps palette indices 224–255 to themselves, so the software renderer draws lamp faces at full intensity whatever the lightmap says. GLQuake converts textures to RGB and multiplies every texel by the lightmap, so the same lamps fade into the dark. Torch models are exempt: R_DrawAliasModel forces flame.mdl to full light. Not a demo: a local server, 15 fixed steps forward from spawn."></div>
<div class="capture-after"><p>GL</p><img loading="lazy" width="640" height="480" src="shots/fullbright.png" alt="GL. Every light level of the colormap maps palette indices 224–255 to themselves, so the software renderer draws lamp faces at full intensity whatever the lightmap says. GLQuake converts textures to RGB and multiplies every texel by the lightmap, so the same lamps fade into the dark. Torch models are exempt: R_DrawAliasModel forces flame.mdl to full light. Not a demo: a local server, 15 fixed steps forward from spawn."></div>
</div><div class="capture-control" hidden><label for="capture-compare-fullbright-slider">Reveal changed image (Software → GL)</label> <input id="capture-compare-fullbright-slider" type="range" min="0" max="100" value="50" step="1" aria-describedby="capture-compare-fullbright-description"> <output for="capture-compare-fullbright-slider">50%</output></div><figcaption id="capture-compare-fullbright-description">Every light level of the colormap maps palette indices 224–255 to themselves, so the software renderer draws lamp faces at full intensity whatever the lightmap says. GLQuake converts textures to RGB and multiplies every texel by the lightmap, so the same lamps fade into the dark. Torch models are exempt: R_DrawAliasModel forces flame.mdl to full light. Not a demo: a local server, 15 fixed steps forward from spawn.</figcaption></figure>
<figure class="capture-pair" id="capture-compare-explosion"><h4>Dynamic light and particles: demo3 rocket explosion</h4><div class="capture-images">
<div class="capture-before"><p>Software</p><img loading="lazy" width="640" height="480" src="shots/software/explosion.png" alt="Software. The software renderer adds the explosion dlight into the surface cache, so nearby walls brighten. GLQuake defaults to gl_flashblend 1: lightmaps are left alone and R_RenderDlights draws an additive sphere instead. Particles are distance-scaled squares in software and small textured triangles in GL. Same demo message in both."></div>
<div class="capture-after"><p>GL</p><img loading="lazy" width="640" height="480" src="shots/explosion.png" alt="GL. The software renderer adds the explosion dlight into the surface cache, so nearby walls brighten. GLQuake defaults to gl_flashblend 1: lightmaps are left alone and R_RenderDlights draws an additive sphere instead. Particles are distance-scaled squares in software and small textured triangles in GL. Same demo message in both."></div>
</div><div class="capture-control" hidden><label for="capture-compare-explosion-slider">Reveal changed image (Software → GL)</label> <input id="capture-compare-explosion-slider" type="range" min="0" max="100" value="50" step="1" aria-describedby="capture-compare-explosion-description"> <output for="capture-compare-explosion-slider">50%</output></div><figcaption id="capture-compare-explosion-description">The software renderer adds the explosion dlight into the surface cache, so nearby walls brighten. GLQuake defaults to gl_flashblend 1: lightmaps are left alone and R_RenderDlights draws an additive sphere instead. Particles are distance-scaled squares in software and small textured triangles in GL. Same demo message in both.</figcaption></figure>
