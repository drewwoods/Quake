<figure class="concept" aria-labelledby="interpolation-title">
  <h3 id="interpolation-title">The interesting part is how Quake chooses the interval</h3>
  <p><code>CL_ReadFromServer</code> advances <code>cl.time</code> and drains incoming messages. <code>CL_LerpPoint</code> then fits that clock to the last two server timestamps. There is no configurable snapshot-delay buffer here: Quake keeps two samples and corrects the clock when it gets outside their interval.</p>
  <div class="svg-scroll">
    <svg class="explain-svg" viewBox="0 0 800 350" role="img" aria-labelledby="snapshot-title snapshot-desc">
      <title id="snapshot-title">A 200-millisecond snapshot gap is compressed into a 100-millisecond interpolation interval</title>
      <desc id="snapshot-desc">Received entity samples are from server times 10.000 and 10.200 seconds. Because their gap exceeds 0.1 seconds, CL_LerpPoint rewrites the older timestamp to 10.100, keeping its old position. At client time 10.150 the entity is halfway between the two positions, although that time is three quarters of the way through the original sample interval.</desc>
      <text x="32" y="28" class="svg-heading">Received samples · server time, not packet arrival time</text>
      <path d="M100 85H700" class="divider-line"/>
      <circle cx="100" cy="85" r="6" class="client-dot"/>
      <circle cx="700" cy="85" r="6" class="client-dot"/>
      <text x="100" y="61">older · 10.000 s</text>
      <text x="700" y="61" text-anchor="end">newest · 10.200 s</text>
      <text x="100" y="116">msg_origins[1]</text>
      <text x="700" y="116" text-anchor="end">msg_origins[0]</text>
      <text x="400" y="80" text-anchor="middle">200 ms gap</text>

      <text x="32" y="169" class="svg-heading">After CL_LerpPoint limits the gap</text>
      <path d="M100 228H400" class="divider-line" stroke-dasharray="4 5"/>
      <path d="M400 228H700" class="trace-line"/>
      <path d="M400 215V241M700 215V241" class="hull-boundary"/>
      <text x="400" y="203" text-anchor="middle">10.100 s</text>
      <text x="700" y="203" text-anchor="middle">10.200 s</text>
      <text x="400" y="268" text-anchor="middle">mtime[1] rewritten</text>
      <text x="700" y="268" text-anchor="middle">mtime[0]</text>
      <circle cx="550" cy="228" r="8" class="client-dot"/>
      <path d="M550 241V292" class="trace-line"/>
      <text x="550" y="319" text-anchor="middle">cl.time = 10.150 → fraction = 0.5</text>
    </svg>
  </div>
  <figcaption><b>The timestamp changes; the stored older position does not.</b> In this illustrative gap, the same two entity positions are interpolated over 100 ms instead of 200 ms. That bounds the interval used for smoothing; it does not reconstruct the missing updates. Source: WinQuake/cl_main.c:391-408, WinQuake/cl_main.c:634-661, <a href="../../historical/plans/carmack/by_day/johnc_plan_19960810.txt">Carmack .plan, 10 Aug 1996</a>.</figcaption>
  <blockquote class="era">
    <p><strong>.plan.</strong> In the shipping version of Quake, some latency was introduced on purpose to keep the displayed frame simulation time between the last two packets from the server so that the variability in arrival time could be smoothed out. — Carmack, 10 Aug 1996</p>
  </blockquote>
  <div class="table-scroll">
    <table class="grid">
      <thead><tr><th scope="col">What happens</th><th scope="col">What the engine actually does</th></tr></thead>
      <tbody>
        <tr><td>Client clock passes the newest sample</td><td>Clamp the fraction to 1: no movement extrapolation. If the raw fraction exceeds 1.01, also reset <code>cl.time</code> to the newest timestamp. The lower boundary has the matching −0.01 tolerance.</td></tr>
        <tr><td>Original local server is active</td><td><code>sv.active</code> forces fraction 1 and resets <code>cl.time</code> to the newest timestamp. Client and local server already run in the same host frame. Zero sample interval, <code>cl_nolerp</code> and timedemo take this same branch.</td></tr>
        <tr><td>One entity appears to teleport</td><td>Later, <code>CL_RelinkEntities</code> overrides the fraction for that entity if any position component changes by more than 100 units. <code>forcelink</code> also copies the newest pose directly. These decisions do not reset the shared client clock.</td></tr>
      </tbody>
    </table>
  </div>
  <p class="diagram-return">When debugging motion, inspect <code>cl.mtime[2]</code> and <code>cl.time</code> first, then the entity’s <code>msg_origins[2]</code> and <code>forcelink</code>. A snap may come from clock correction or from an entity-specific decision. Source: WinQuake/cl_main.c:391-434, WinQuake/cl_main.c:499-533.</p>
</figure>

  <p><b>Simplified simulation of the client rule, not a capture.</b> One entity runs a
    straight corridor at 320 units per second and teleports 160 units forward at server time
    0.600 s. The server sends one snapshot per interval over an unreliable datagram
    (<code>WinQuake/net_dgrm.c:301-311</code>); a lost one is simply never replaced. The client
    draws 25 frames per second and applies <code>CL_LerpPoint</code> and the
    <code>CL_RelinkEntities</code> teleport check, nothing else: two samples, a gap limited to
    0.1 s, a fraction clamped to [0, 1], and no extrapolation past the newest sample. This is
    original NetQuake — no local physics prediction, no snapshot buffer to tune.</p>

  <figcaption><b>Three curves, one time axis.</b> The server line is ground truth, the dots are
    what arrived, the stepped line is what the player sees — always behind, because the client
    aims to stay between the last two timestamps it holds. The three labels are this
    figure's, not the engine's: a <i>pause</i> is a frame that displays no movement — the
    fraction clamped at 1 with no newer sample, since NetQuake never extrapolates, or a
    fraction restarted at 0 on the older sample. A <i>snap</i> is the &gt;100-unit relink
    override, or any displayed jump over 2.5× the per-frame nominal 12.8 units. Lost packets are not
    resent or reconstructed; the next snapshot to arrive simply becomes <code>mtime[0]</code>
    and pushes the previous one into <code>mtime[1]</code>, which is why a loss shows up as a
    freeze followed by compressed motion rather than a gap in the path. Sizes and the loss
    patterns are chosen to be reproducible, not measured. Source:
    WinQuake/cl_main.c:391-434, WinQuake/cl_main.c:499-533, WinQuake/cl_parse.c:773-776,
    WinQuake/net_dgrm.c:301-311, WinQuake/net_dgrm.c:370-384.</figcaption>
</figure>
<script>
(function () {
  "use strict";
  const root = document.getElementById("netlab");
  if (!root) return;

  /* The scene: constant run speed plus one teleport, so both snap causes are
     reachable — the >100-unit relink override and a clock reset. */
  const SPEED = 320, TELEPORT_T = 0.6, TELEPORT_JUMP = 160;
  const FRAME = 0.04, FRAMES = 25, RUN_END = FRAME * FRAMES;
  const LERP_LIMIT = 0.1, TOL = 0.01, TELEPORT_UNITS = 100;
  const NOMINAL = SPEED * FRAME, SNAP_STEP = 2.5 * NOMINAL;
  const MAX_POS = 500;
  /* Plot box: time left to right, position bottom to top. */
  const X0 = 70, X1 = 790, Y0 = 210, Y1 = 30, T_SPAN = RUN_END + 0.05;
  const WIRE_Y = 258, FRAME_Y = 292;
  const LOSS = {
    none: function () { return false; },
    one: function (n) { return n === 3; },
    burst: function (n) { return n === 3 || n === 4; },
    every4: function (n) { return n % 4 === 0; }
  };

  const el = function (id) { return root.querySelector("#" + id); };
  const intervalSel = el("nl-interval"), delaySel = el("nl-delay"), lossSel = el("nl-loss");
  const stepBtn = el("nl-step");
  let frame, guesses, hits;

  function serverPos(t) { return SPEED * t + (t >= TELEPORT_T - 1e-9 ? TELEPORT_JUMP : 0); }
  function x(t) { return X0 + (X1 - X0) * t / T_SPAN; }
  function y(p) { return Y0 + (Y1 - Y0) * p / MAX_POS; }
  function svg(tag, attrs) {
    const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    Object.keys(attrs).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    return node;
  }

  function packets() {
    const interval = Number(intervalSel.value), delay = Number(delaySel.value);
    const lost = LOSS[lossSel.value], out = [];
    for (let n = 1; n * interval <= RUN_END + 1e-9; n++)
      out.push({ n: n, time: n * interval, pos: serverPos(n * interval),
                 arrive: n * interval + delay, lost: lost(n) });
    return out;
  }

  /* One client frame, in host order: advance cl.time, parse arrivals, lerp.
     svc_time shifts the pair (cl_parse.c:773-776); CL_LerpPoint limits the gap
     and clamps the fraction; CL_RelinkEntities overrides f for a big delta. */
  function run(upto) {
    const pkts = packets(), log = [];
    let clTime = 0, m1 = 0, m0 = 0, o1 = 0, o0 = 0, got = 0, shown = 0;
    for (let i = 1; i <= upto; i++) {
      const prev = shown, now = i * FRAME, arrived = [];
      clTime += FRAME;
      pkts.forEach(function (p) {
        if (p.lost || p.arrive <= now - FRAME + 1e-9 || p.arrive > now + 1e-9) return;
        m1 = m0; m0 = p.time; o1 = o0; o0 = p.pos; got++; arrived.push(p);
      });
      let f = m0 - m1, frac, reset = "", clamped = false;
      if (!f) { clTime = m0; frac = 1; }                 // no pair yet, or a local server
      else {
        if (f > LERP_LIMIT) { m1 = m0 - LERP_LIMIT; f = LERP_LIMIT; clamped = true; }
        frac = (clTime - m1) / f;
        if (frac < 0) { if (frac < -TOL) { clTime = m1; reset = "low"; } frac = 0; }
        else if (frac > 1) { if (frac > 1 + TOL) { clTime = m0; reset = "high"; } frac = 1; }
      }
      const delta = o0 - o1, tele = Math.abs(delta) > TELEPORT_UNITS;
      shown = o1 + (tele ? 1 : frac) * delta;
      const moved = shown - prev;
      log.push({ i: i, now: now, clTime: clTime, m1: m1, m0: m0, f: f, frac: frac,
                 o1: o1, o0: o0, delta: delta, shown: shown, moved: moved,
                 server: serverPos(now), arrived: arrived, clamped: clamped,
                 reset: reset, tele: tele, got: got,
                 kind: Math.abs(moved) < 0.5 ? "pause"
                       : (tele || Math.abs(moved) > SNAP_STEP) ? "snap" : "smooth" });
    }
    return { pkts: pkts, log: log };
  }

  function drawAxes() {
    let d = "M" + X0 + " " + Y0 + "H" + X1 + "M" + X0 + " " + Y1 + "V" + (FRAME_Y + 8);
    el("nl-frame-axes").setAttribute("d", d);
    const g = el("nl-grid");
    g.textContent = "";
    for (let t = 0; t <= RUN_END + 1e-9; t += 0.1) {
      g.appendChild(svg("line", { class: "nl-axis", x1: x(t), x2: x(t), y1: Y0, y2: Y0 + 4 }));
      const label = svg("text", { class: "nl-tick", x: x(t) + 5, y: Y0 + 18 });
      label.textContent = t.toFixed(1);
      g.appendChild(label);
    }
    [0, 250, 500].forEach(function (p) {
      const label = svg("text", { class: "nl-tick", x: X0 - 8, y: y(p) + 4, "text-anchor": "end" });
      label.textContent = p;
      g.appendChild(label);
    });
    [["server time (s)", X0, Y0 + 34, "k-muted", "start"],
     ["arrival", X0 - 8, WIRE_Y + 4, "k-host", "end"],
     ["server position", X0, 16, "k-sim", "start"],
     ["snapshot", 260, 16, "k-host", "start"],
     ["displayed position", 500, 16, "k-cl", "start"]].forEach(function (k) {
      const label = svg("text", { class: "nl-key " + k[3], x: k[1], y: k[2],
        "text-anchor": k[4] });
      label.textContent = k[0];
      el("nl-legend").appendChild(label);
    });
  }

  function draw(sim) {
    const log = sim.log, last = log[log.length - 1];
    /* Server truth, sampled finely and broken at the teleport. */
    let d = "";
    for (let t = 0; t <= RUN_END + 1e-9; t += 0.01) {
      const jump = t >= TELEPORT_T - 1e-9 && t - 0.01 < TELEPORT_T - 1e-9;
      d += (!d || jump ? "M" : "L") + x(t).toFixed(1) + " " + y(serverPos(t)).toFixed(1);
    }
    el("nl-server").setAttribute("d", d);

    const g = el("nl-packets");
    g.textContent = "";
    sim.pkts.forEach(function (p) {
      g.appendChild(svg("circle", { class: p.lost ? "nl-lost" : "nl-snap",
        cx: x(p.time).toFixed(1), cy: y(p.pos).toFixed(1), r: 4 }));
      if (p.lost)
        g.appendChild(svg("path", { class: "nl-lost", "stroke-width": 1.5,
          d: "M" + (x(p.time) - 6) + " " + (y(p.pos) - 6) + "l12 12M" + (x(p.time) + 6)
             + " " + (y(p.pos) - 6) + "l-12 12" }));
      /* Send time to arrival time, on its own lane: a lost packet stops short. */
      const to = p.lost ? x(p.time) + 8 : x(Math.min(p.arrive, T_SPAN));
      g.appendChild(svg("path", { class: "nl-wire",
        d: "M" + x(p.time).toFixed(1) + " " + y(p.pos).toFixed(1) + "V" + WIRE_Y
           + "H" + to.toFixed(1) }));
      if (!p.lost)
        g.appendChild(svg("circle", { class: "nl-snap", cx: to.toFixed(1), cy: WIRE_Y, r: 2.5 }));
    });

    /* Displayed position: a staircase, only as far as the current frame. */
    let s = "M" + x(0) + " " + y(0);
    log.forEach(function (l) { s += "H" + x(l.now).toFixed(1) + "V" + y(l.shown).toFixed(1); });
    el("nl-shown").setAttribute("d", s);

    const fg = el("nl-frames");
    fg.textContent = "";
    for (let i = 1; i <= FRAMES; i++)
      fg.appendChild(svg("line", { class: i === frame ? "nl-axis nl-now" : "nl-axis",
        x1: x(i * FRAME), x2: x(i * FRAME),
        y1: FRAME_Y - (i === frame ? 8 : 4), y2: FRAME_Y }));
    if (last) {
      fg.appendChild(svg("circle", { class: "nl-dot",
        cx: x(last.now).toFixed(1), cy: y(last.shown).toFixed(1), r: 4 }));
      el("nl-cursor").setAttribute("x1", x(last.now).toFixed(1));
      el("nl-cursor").setAttribute("x2", x(last.now).toFixed(1));
    }
    const lane = svg("text", { class: "nl-tick", x: X1, y: FRAME_Y + 16, "text-anchor": "end" });
    lane.textContent = "client frames, " + Math.round(1 / FRAME) + " per second";
    fg.appendChild(lane);
  }

  function stateRows(l) {
    if (!l) return [["client frame", "0 of " + FRAMES + " · nothing received yet"]];
    return [
      ["client frame", l.i + " of " + FRAMES + " · wall clock " + l.now.toFixed(2) + " s"],
      ["cl.time", l.clTime.toFixed(3) + " s" + (l.reset ? " · reset to mtime[" + (l.reset === "low" ? 1 : 0) + "]" : "")],
      ["cl.mtime[1] → [0]", l.m1.toFixed(3) + " → " + l.m0.toFixed(3) + " s"
        + (l.clamped ? " · older timestamp rewritten to newest − 0.1" : "")],
      ["interval used", l.f ? l.f.toFixed(3) + " s" : "0 · single sample, fraction forced to 1"],
      ["fraction", l.frac.toFixed(3) + (l.tele ? " · overridden to 1 for this entity" : "")],
      ["msg_origins[1] → [0]", l.o1.toFixed(1) + " → " + l.o0.toFixed(1)
        + " · delta " + l.delta.toFixed(1) + (l.tele ? " (over 100)" : "")],
      ["displayed", l.shown.toFixed(1) + " · moved " + l.moved.toFixed(1) + " this frame"],
      ["server now", l.server.toFixed(1) + " · displayed lags by " + (l.server - l.shown).toFixed(1)],
      ["snapshots received", l.got + (l.arrived.length ? " · #" + l.arrived.map(function (p) { return p.n; }).join(", #") + " this frame" : "")]
    ];
  }

  /* Why the frame looked the way it did, in the engine's terms. */
  function explain(l) {
    const parts = [];
    if (l.arrived.length)
      parts.push("Snapshot #" + l.arrived[l.arrived.length - 1].n + " arrived carrying server time "
        + l.m0.toFixed(3) + " s; svc_time pushed the previous one into mtime[1].");
    if (l.clamped)
      parts.push("The pair spanned more than 0.1 s, so mtime[1] was rewritten to "
        + l.m1.toFixed(3) + " s while keeping its old position: the same two positions are now"
        + " swept in 100 ms, faster than the entity really moved.");
    if (l.reset === "high")
      parts.push("The raw fraction passed 1.01, so cl.time was pulled back to mtime[0].");
    if (l.reset === "low")
      parts.push("The raw fraction fell below −0.01, so cl.time was pushed up to mtime[1].");
    if (l.tele)
      parts.push("A component of the delta exceeds 100 units, so CL_RelinkEntities forces f = 1"
        + " for this entity: it is drawn at the newest sample, not interpolated.");
    if (!l.got) parts.push("No snapshot has arrived yet: the client has nothing to draw but the start pose.");
    else if (l.kind === "pause" && l.tele) parts.push("That sample has not changed, so nothing moves.");
    else if (l.kind === "pause" && l.frac >= 1) parts.push("The fraction is clamped at 1 with no newer"
      + " sample, and NetQuake never extrapolates: the entity waits for the next packet.");
    else if (l.kind === "pause") parts.push("The fraction restarted near 0, so this frame redraws the"
      + " older sample's position: motion resumes from there.");
    if (l.kind === "snap") parts.push("The displayed position jumped " + Math.abs(l.moved).toFixed(1)
      + " units in one frame, against a nominal " + NOMINAL.toFixed(1) + ".");
    if (l.kind === "smooth") parts.push("Displayed motion this frame was " + (l.moved / NOMINAL).toFixed(1)
      + "× the nominal per-frame step.");
    return parts.join(" ");
  }

  const LABEL = { smooth: "smooth", pause: "pause", snap: "snap" };

  function render(guess) {
    const sim = run(frame), l = sim.log[sim.log.length - 1];
    draw(sim);
    const body = el("nl-state");
    body.textContent = "";
    stateRows(l).forEach(function (row) {
      const tr = document.createElement("tr"), th = document.createElement("th");
      th.scope = "row";
      th.textContent = row[0];
      const td = document.createElement("td");
      td.className = "nl-num";
      td.textContent = row[1];
      tr.appendChild(th);
      tr.appendChild(td);
      body.appendChild(tr);
    });
    el("nl-question").textContent = frame === FRAMES
      ? "Run complete. Change a control to start over, or reset."
      : "Client frame " + (frame + 1) + " of " + FRAMES
        + ": smooth movement, a pause, or a snap?";
    stepBtn.disabled = frame === FRAMES;
    ["nl-smooth", "nl-pause", "nl-snap"].forEach(function (id) { el(id).disabled = frame === FRAMES; });
    if (!l) {
      el("nl-result").textContent = "Predict the next client frame, then watch the stepped line.";
      return;
    }
    const score = guesses ? " Predictions: " + hits + " of " + guesses + " right." : "";
    const verdict = guess
      ? (guess === l.kind ? "You said " + LABEL[guess] + " — right. " :
         "You said " + LABEL[guess] + "; it was " + LABEL[l.kind] + ". ")
      : "";
    el("nl-result").textContent = verdict + "Frame " + l.i + ": " + LABEL[l.kind] + ". "
      + explain(l) + score;
  }

  function advance(guess) {
    if (frame === FRAMES) return;
    frame++;
    if (guess) {
      guesses++;
      if (guess === run(frame).log[frame - 1].kind) hits++;
    }
    render(guess);
  }

  function reset() { frame = 0; guesses = 0; hits = 0; render(null); }

  [["nl-smooth", "smooth"], ["nl-pause", "pause"], ["nl-snap", "snap"],
   ["nl-step", null]].forEach(function (pair) {
    el(pair[0]).addEventListener("click", function () { advance(pair[1]); });
  });
  el("nl-reset").addEventListener("click", reset);
  [intervalSel, delaySel, lossSel].forEach(function (sel) {
    sel.addEventListener("change", reset);
  });

  drawAxes();
  reset();
  root.classList.add("nl-js");
  root.querySelector(".nl-live").hidden = false;
})();
</script>
